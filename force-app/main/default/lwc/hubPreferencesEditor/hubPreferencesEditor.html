<template>
    <section class="card" aria-labelledby="prefs-heading">
        <h2 id="prefs-heading" class="h2">{t.heading}</h2>
        <p class="muted">{t.intro}</p>

        <form onsubmit={handleSave} novalidate>
            <div class="field">
                <label for="contact-method">{t.contactLabel}</label>
                <select id="contact-method" name="contactMethod" onchange={handleChange}>
                    <template for:each={contactOptions} for:item="option">
                        <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                    </template>
                </select>
            </div>

            <div class="field">
                <label for="needs">{t.needsLabel}</label>
                <textarea id="needs" name="needs" rows="4" maxlength="2000" value={needs} onchange={handleChange}></textarea>
            </div>

            <div class="field check">
                <input id="easy-read-pref" name="easyReadPref" type="checkbox" checked={easyReadPref} onchange={handleChange} />
                <label for="easy-read-pref">{t.easyReadLabel}</label>
            </div>

            <div class="field">
                <label for="support-name">{t.supportNameLabel}</label>
                <input id="support-name" name="supportName" type="text" maxlength="80" value={supportName} onchange={handleChange} />
            </div>

            <div class="field">
                <label for="support-phone">{t.supportPhoneLabel}</label>
                <input id="support-phone" name="supportPhone" type="tel" maxlength="40" value={supportPhone} onchange={handleChange} />
            </div>

            <div class="actions">
                <button type="submit" class="btn" disabled={isSaving}>{saveLabel}</button>
                <div class="status" role="status" aria-live="polite" aria-atomic="true">{messageText}</div>
            </div>
        </form>
    </section>
</template>
