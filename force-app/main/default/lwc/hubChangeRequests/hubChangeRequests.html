<template>
    <section class="card" aria-labelledby="request-heading">
        <h2 id="request-heading" class="h2">{t.heading}</h2>
        <p class="muted">{t.intro}</p>

        <form onsubmit={handleSubmit} novalidate>
            <div class="field">
                <label for="request-type">{t.typeLabel}</label>
                <select id="request-type" name="requestType" onchange={handleChange}>
                    <template for:each={typeOptions} for:item="option">
                        <option key={option.value} value={option.value} selected={option.selected}>{option.label}</option>
                    </template>
                </select>
            </div>

            <div class="field">
                <label for="request-details">{t.detailsLabel}</label>
                <textarea id="request-details" name="details" rows="4" maxlength="2000" value={details} onchange={handleChange}></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="btn" disabled={isSaving}>{submitLabel}</button>
                <div class="status" role="status" aria-live="polite" aria-atomic="true">{messageText}</div>
            </div>
        </form>
    </section>

    <section class="card" aria-labelledby="history-heading">
        <h2 id="history-heading" class="h2">{t.historyHeading}</h2>
        <p lwc:if={noRequests} class="muted">{t.noRequests}</p>
        <ul class="requests">
            <template for:each={requests} for:item="request">
                <li key={request.key} class="request">
                    <div class="row">
                        <h3 class="h3">{request.requestType}</h3>
                        <span class="chip">{request.statusLabel}</span>
                    </div>
                    <p class="muted">{request.dateText}</p>
                    <p class="body">{request.details}</p>
                    <p lwc:if={request.hasResponse} class="response"><strong>{t.response}</strong> {request.staffResponse}</p>
                </li>
            </template>
        </ul>
    </section>
</template>
